[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-data-explorer"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<3.3",
  "pyproj>=3.7,<3.8",
  "shapely>=2.1,<2.2",
]

[tool.setuptools.packages.find]
include = ["config*", "explorer*"]
